name: Publish authorized ljglobal articles every three days

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Collect now even if the 72-hour interval has not elapsed'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/collectors/**'
      - '.github/workflows/collect-ljglobal.yml'
      - '.github/workflows/static.yml'

permissions:
  contents: read

concurrency:
  group: ljglobal-topic-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'googleList/ggadto'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      collected: ${{ steps.collect.outputs.collected }}
      published_sha: ${{ steps.collect.outputs.published_sha }}
      expected_state_sha: ${{ steps.collect.outputs.expected_state_sha }}
      collection_time: ${{ steps.collect.outputs.collection_time }}
      has_failures: ${{ steps.collect.outputs.has_failures }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run offline collector tests
        run: python3 -m unittest discover -s .github/collectors -p 'test_*.py' -v
      - name: Collect licensed full articles and original images, then commit website files
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_COLLECT: ${{ inputs.force || false }}
        shell: bash
        run: |
          args=()
          if [ "$FORCE_COLLECT" = "true" ]; then args+=(--force); fi
          python3 .github/collectors/publish_ljglobal.py --out "$RUNNER_TEMP/ljglobal-output" "${args[@]}"
      - name: Save publication report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ljglobal-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/ljglobal-output/publication-report.json
          retention-days: 90
          if-no-files-found: warn
  deploy:
    needs: collect
    if: needs.collect.outputs.collected == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/static.yml
    with:
      ref: ${{ needs.collect.outputs.published_sha }}
  finalize:
    needs: [collect, deploy]
    if: needs.collect.outputs.collected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the deployed website version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.collect.outputs.published_sha }}
          persist-credentials: false
      - name: Advance the 72-hour cursor only after successful Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_STATE_SHA: ${{ needs.collect.outputs.expected_state_sha }}
          COLLECTION_TIME: ${{ needs.collect.outputs.collection_time }}
          PUBLISHED_SHA: ${{ needs.collect.outputs.published_sha }}
          HAS_FAILURES: ${{ needs.collect.outputs.has_failures }}
        run: python3 .github/collectors/publish_ljglobal.py --finalize
